# Dependabot version updates.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ [build] "
    groups:
      # Kotlin, the Compose plugin and the Compose Multiplatform runtime are
      # version-locked to one another, so a PR moving one without the others is
      # a PR that does not compile. The `kotlin*` wildcard deliberately also
      # catches `org.jetbrains.kotlinx:*` (serialization, coroutines), whose
      # runtimes pair with the compiler plugin of the same generation.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
      ktor:
        patterns:
          - "io.ktor:*"
      # Everything else that is not a major: one PR a week, gated by the same
      # `./gradlew check` a human PR gets. Majors are left ungrouped on purpose
      # — those are the ones worth reading one at a time.
      routine:
        update-types:
          - minor
          - patch

  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ [ci] "
    groups:
      actions:
        patterns:
          - "*"
